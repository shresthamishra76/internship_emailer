name: sync

on:
  workflow_dispatch:
    # Manual trigger from the Actions tab, and what /tick calls.
    inputs:
      dry_run:
        description: "Run without sending or saving state"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit the updated data/seen_jobs.json

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pydeps-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run > "$RUNNER_TEMP/bot.log" 2>&1
          else
            python -m src.main > "$RUNNER_TEMP/bot.log" 2>&1
          fi

      - name: Commit updated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/seen_jobs.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git add data/seen_jobs.json
          git commit -m "chore: sync [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); replaying our state onto origin/main."
            cp data/seen_jobs.json "${RUNNER_TEMP}/seen_jobs.json"
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/seen_jobs.json" data/seen_jobs.json
            if git diff --quiet -- data/seen_jobs.json; then
              echo "State already current on origin/main; nothing to push."
              exit 0
            fi
            git add data/seen_jobs.json
            git commit -m "chore: sync [skip ci]"
          done

          echo "::error::Could not push updated state after 3 attempts."
          exit 1
